name: NPB player stats scraper

on:
  schedule:
    # 13:00 UTC = 22:00 in Japan (Asia/Tokyo, UTC+9), net als de standen-
    # scraper — na afloop van de meeste NPB-wedstrijden van die dag.
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installeer dependencies
        run: pip install requests beautifulsoup4

      - name: Spelersstatistieken scrapen
        run: python npb_player_stats_scraper.py

      - name: Wijzigingen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add npb_player_stats.json
          git diff --staged --quiet || git commit -m "Update NPB player stats"
          git push
