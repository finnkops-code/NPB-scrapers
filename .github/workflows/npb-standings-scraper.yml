name: NPB schedule scraper

on:
  schedule:
    # 00:00 UTC = 09:00 in Japan (Asia/Tokyo, UTC+9), zoals gevraagd.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installeer dependencies
        run: pip install requests beautifulsoup4

      - name: Schedule en uitslagen scrapen
        run: python npb_schedule_scraper.py

      - name: Wijzigingen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add npb_schedule.json
          git diff --staged --quiet || git commit -m "Update NPB schedule/uitslagen"
          git push
